<!DOCTYPE html>
<html lang="ua" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кабінет майстра | Явір Ілляна</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        :root[data-theme="dark"] {
            --accent: #d88c9a;
            --accent-invert: #161514;
            --tg-bg: #161514;
            --tg-card: rgba(30, 28, 26, 0.88);
            --tg-card-hover: rgba(42, 38, 35, 0.92);
            --tg-border: rgba(226, 215, 204, 0.1);
            --tg-text: #f3efe9;
            --tg-muted: #a69e94;
        }

        :root[data-theme="light"] {
            --accent: #b86b79;
            --accent-invert: #ffffff;
            --tg-bg: #e6dfd5;
            --tg-card: rgba(255, 252, 248, 0.88);
            --tg-card-hover: rgba(242, 237, 228, 0.92);
            --tg-border: rgba(0, 0, 0, 0.08);
            --tg-text: #2c2825;
            --tg-muted: #756d65;
        }

        body {
            background-color: var(--tg-bg) !important;
            color: var(--tg-text) !important;
            padding-bottom: 90px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* Преміальний фоновий шар з вашою фотографією */
        .master-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -999; overflow: hidden; background-color: var(--tg-bg);
        }
        .master-bg img {
            width: 100%; height: 100%; object-fit: cover;
            filter: blur(8px) brightness(0.35) contrast(1.1);
            transform: scale(1.08);
            transition: filter 0.4s ease;
        }
        [data-theme="light"] .master-bg img {
            filter: blur(8px) brightness(0.7) contrast(1.05);
        }

        /* Ультрасучасна нижня панель навігації у вигляді капсули */
        .tg-bottom-nav {
            position: fixed;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 390px;
            background: var(--tg-card);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--tg-border);
            border-radius: 30px;
            display: flex;
            justify-content: space-around;
            padding: 8px 6px;
            z-index: 9999;
            box-shadow: 0 15px 35px rgba(0,0,0,0.35);
        }
        .tg-nav-btn {
            background: transparent;
            border: none;
            color: var(--tg-muted);
            font-size: 9px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            text-transform: uppercase;
            flex: 1;
            padding: 6px 2px;
            border-radius: 20px;
            transition: all 0.25s ease;
        }
        .tg-nav-btn span.icon { 
            font-size: 15px; 
            transition: transform 0.2s ease;
        }
        .tg-nav-btn.active {
            color: var(--accent);
            background: rgba(216, 140, 154, 0.12);
        }
        .tg-nav-btn.active span.icon {
            transform: scale(1.15);
        }

        .tg-search-bar {
            background: var(--tg-card-hover);
            border-radius: 20px;
            padding: 9px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
            border: 1px solid var(--tg-border);
            backdrop-filter: blur(10px);
        }
        .tg-search-bar input {
            background: transparent;
            border: none;
            color: var(--tg-text);
            font-size: 12px;
            outline: none;
            width: 100%;
        }
        .tg-search-bar input::placeholder {
            color: var(--tg-muted);
        }

        button, input, select, .control-btn, .btn-main, .cal-day {
            position: relative;
            z-index: 10;
            pointer-events: auto !important;
            cursor: pointer;
        }

        .master-section {
            background: var(--tg-card) !important;
            border-color: var(--tg-border) !important;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 16px;
        }

        .notification-banner {
            background: rgba(216, 140, 154, 0.22); border: 1px solid var(--accent);
            padding: 10px; border-radius: 14px; font-size: 10px; color: var(--tg-text);
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
            animation: pulseBanner 1.5s infinite;
            backdrop-filter: blur(10px);
        }
        @keyframes pulseBanner {
            0% { opacity: 0.85; }
            50% { opacity: 1; transform: scale(1.01); }
            100% { opacity: 0.85; }
        }
    </style>
</head>
<body data-theme="dark">

    <!-- Фонова картинка майстра -->
    <div class="master-bg">
        <img src="PXL_20241102_164641261.jpg" alt="Master Background">
    </div>

    <div class="mobile-container master-body">
        
        <div class="utility-bar" style="margin-bottom: 10px;">
            <div style="display: flex; align-items: center; gap: 8px;">
                <div style="width: 34px; height: 34px; border-radius: 50%; overflow:hidden; border:1.5px solid var(--accent);">
                    <img src="PXL_20241102_164641261.jpg" style="width:100%; height:100%; object-fit:cover;" alt="Ілляна">
                </div>
                <span style="font-family:'Syne',sans-serif; font-size:12px; font-weight:800; color:var(--tg-text);">ЯВІР ІЛЛЯНА // CRM</span>
            </div>
            <button class="control-btn" onclick="toggleMasterTheme()" style="border-radius:50%; width:34px; height:34px; padding:0; display:flex; align-items:center; justify-content:center; background:var(--tg-card); border-color:var(--tg-border); color:var(--tg-text);">☀️/🌙</button>
        </div>

        <!-- Екран авторизації -->
        <div id="masterLoginBox" class="form-card master-section" style="text-align: center; margin-top: 40px;">
            <h2 style="font-family:'Syne',sans-serif; font-size: 16px; margin-bottom: 10px; color:var(--tg-text);">ДОСТУП ДО CRM</h2>
            <input type="password" id="masterPinInput" class="input-box" placeholder="PIN (1988)" style="text-align: center; margin-bottom: 10px; background: rgba(0,0,0,0.15); border-color:var(--tg-border); color:var(--tg-text);">
            <button class="btn-main" onclick="loginMainPin()">Увійти</button>
            <button class="control-btn" onclick="forceBypassPin()" style="margin-top: 8px; width: 100%; background:var(--tg-card-hover); border-color:var(--tg-border); color:var(--tg-text);">Швидкий вхід</button>
        </div>

        <!-- Панель управління CRM -->
        <div id="masterDashboard" style="display: none; flex-direction: column; gap: 10px;">

            <!-- Банер сповіщення -->
            <div id="newBookingAlertBanner" class="notification-banner" style="display: none;">
                <span id="alertBannerText">🔔 Новий запис!</span>
                <button class="control-btn" onclick="handleBannerClick()" style="background:var(--tg-card); border-color:var(--accent); color:var(--tg-text);">Переглянути</button>
            </div>

            <!-- Робочий рядок пошуку по записах та клієнтах -->
            <div class="tg-search-bar">
                <span>🔍</span>
                <input type="text" id="crmSearchInput" placeholder="Пошук клієнта, послуги або телефону..." oninput="filterCrmBookings(this.value)">
            </div>

            <!-- Статистичний міні-віджет -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <div class="form-card master-section" style="padding: 10px; text-align: center; margin: 0;">
                    <div style="font-size: 8px; color: var(--tg-muted);">УСЬОГО ЗАПИСІВ</div>
                    <div id="totalBookingsCountBadge" style="font-size: 14px; font-weight: 700; font-family:'Syne',sans-serif; color: var(--accent);">0</div>
                </div>
                <div class="form-card master-section" style="padding: 10px; text-align: center; margin: 0;">
                    <div style="font-size: 8px; color: var(--tg-muted);">БАЗА КЛІЄНТІВ</div>
                    <div id="totalClientsCountBadge" style="font-size: 14px; font-weight: 700; font-family:'Syne',sans-serif; color: var(--accent);">0</div>
                </div>
            </div>

            <!-- 1. КАЛЕНДАР -->
            <div id="secCalendar" class="master-section form-card">
                <div class="calendar-controls">
                    <button class="control-btn" onclick="changePeriod(-1)" style="background:var(--tg-card-hover); border-color:var(--tg-border);">◀</button>
                    <h3 id="calendarTitle" style="font-size: 12px; font-family:'Syne',sans-serif; color:var(--tg-text);">Місяць</h3>
                    <button class="control-btn" onclick="changePeriod(1)" style="background:var(--tg-card-hover); border-color:var(--tg-border);">▶</button>
                </div>
                <div style="display: flex; gap: 4px; margin-bottom: 6px;">
                    <button class="control-btn" id="btnModeMonth" onclick="setCalendarMode('month')" style="flex:1; background:var(--tg-card-hover); border-color:var(--tg-border);">Місяць</button>
                    <button class="control-btn" id="btnModeWeek" onclick="setCalendarMode('week')" style="flex:1; background:var(--tg-card-hover); border-color:var(--tg-border);">Тиждень</button>
                </div>
                <div id="calendarGridContainer"></div>
                <button class="control-btn" id="blockDayBtn" onclick="toggleBlockSelectedDate()" style="margin-top: 8px; width: 100%; background:var(--tg-card-hover); border-color:var(--tg-border);">🔒 Заблокувати день (вихідний)</button>
                <div style="margin-top: 10px;">
                    <label class="field-label" id="selectedDateLabel" style="color:var(--tg-muted);">Записи на обраний день:</label>
                    <div id="dayBookingsContainer" style="display: flex; flex-direction: column; gap: 6px; max-height: 200px; overflow-y: auto;"></div>
                </div>
            </div>

            <!-- 2. ФІНАНСИ -->
            <div id="secFinances" class="master-section form-card" style="display: none;">
                <h3 style="font-size: 13px; font-family:'Syne',sans-serif; text-transform:uppercase; color:var(--tg-text);">Фінанси та аналітика</h3>
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; text-align: center;">
                    <div style="background:var(--tg-card-hover); padding:8px; border-radius:10px; border:1px solid var(--tg-border);">
                        <div style="font-size:8px; color:var(--tg-muted);">ДОХОДИ</div>
                        <div id="statCompleted" style="font-size:11px; font-weight:700; color:var(--tg-text);">0 ₴</div>
                    </div>
                    <div style="background:var(--tg-card-hover); padding:8px; border-radius:10px; border:1px solid var(--tg-border);">
                        <div style="font-size:8px; color:var(--tg-muted);">ВИТРАТИ</div>
                        <div id="statExpenses" style="font-size:11px; font-weight:700; color:var(--accent);">0 ₴</div>
                    </div>
                    <div style="background:var(--tg-card-hover); padding:8px; border-radius:10px; border:1px solid var(--tg-border);">
                        <div style="font-size:8px; color:var(--tg-muted);">ПРИБУТОК</div>
                        <div id="statNetProfit" style="font-size:11px; font-weight:700; color:#4ade80;">0 ₴</div>
                    </div>
                </div>

                <div style="margin-top: 8px;">
                    <label class="field-label" style="color:var(--tg-muted);">Додати витрату:</label>
                    <div style="display: flex; gap: 6px;">
                        <input type="text" id="expenseNameInput" class="input-box" placeholder="Назва" style="background:var(--tg-card-hover); border-color:var(--tg-border); color:var(--tg-text);">
                        <input type="number" id="expenseAmountInput" class="input-box" placeholder="Сума ₴" style="max-width: 90px; background:var(--tg-card-hover); border-color:var(--tg-border); color:var(--tg-text);">
                        <button class="control-btn" onclick="addExpense()" style="background:var(--tg-card-hover); border-color:var(--tg-border);">+</button>
                    </div>
                    <div id="expensesListContainer" style="display: flex; flex-direction: column; gap: 4px; margin-top: 6px; max-height: 120px; overflow-y: auto;"></div>
                </div>

                <button class="control-btn" onclick="exportToExcel()" style="margin-top: 6px; width: 100%; background:var(--tg-card-hover); border-color:var(--tg-border);">📥 Експортувати записи в Excel</button>
                <button class="control-btn" onclick="exportFinancesToPDF()" style="margin-top: 6px; width: 100%; border-color: #4ade80; color: #4ade80; background:var(--tg-card-hover);">📄 Завантажити звіт у PDF</button>
            </div>

            <!-- 3. БАЗА КЛІЄНТІВ -->
            <div id="secClients" class="master-section form-card" style="display: none;">
                <h3 style="font-size: 13px; font-family:'Syne',sans-serif; text-transform:uppercase; color:var(--tg-text);">База клієнтів</h3>
                <div style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px;">
                    <input type="text" id="regClientName" class="input-box" placeholder="Ім'я клієнта" style="background:var(--tg-card-hover); border-color:var(--tg-border); color:var(--tg-text);">
                    <input type="tel" id="regClientPhone" class="input-box" placeholder="Телефон" style="background:var(--tg-card-hover); border-color:var(--tg-border); color:var(--tg-text);">
                    <input type="text" id="regClientSocial" class="input-box" placeholder="Нікнейм (Inst / Telegram)" style="background:var(--tg-card-hover); border-color:var(--tg-border); color:var(--tg-text);">
                    <button class="control-btn" onclick="addRegularClientManual()" style="background:var(--tg-card-hover); border-color:var(--tg-border);">Додати клієнта</button>
                </div>
                
                <div style="display: flex; gap: 6px; margin-top: 8px;">
                    <button class="control-btn" onclick="exportClientsToExcel()" style="flex:1; background:var(--tg-card-hover); border-color:var(--tg-border);">📤 Експорт бази (Excel)</button>
                    <label class="control-btn" style="flex:1; text-align:center; cursor:pointer; background:var(--tg-card-hover); border-color:var(--tg-border);">
                        📥 Імпорт бази
                        <input type="file" accept=".xlsx, .xls" onchange="importClientsFromExcel(event)" style="display: none;">
                    </label>
                </div>
                <div id="regularClientsContainer" style="display: flex; flex-direction: column; gap: 4px; max-height: 150px; overflow-y: auto; margin-top: 8px;"></div>
            </div>

            <!-- 4. ЗАВАНТАЖИТИ РОБОТИ НА САЙТ -->
            <div id="secWorks" class="master-section form-card" style="display: none;">
                <h3 style="font-size: 13px; font-family:'Syne',sans-serif; text-transform:uppercase; color:var(--tg-text);">Завантажити приклади робіт</h3>
                <div>
                    <label class="field-label" style="color:var(--tg-muted);">Назва / опис роботи:</label>
                    <input type="text" id="newWorkTitleInput" class="input-box" placeholder="Стрижка / Тонування" style="background:var(--tg-card-hover); border-color:var(--tg-border); color:var(--tg-text);">
                </div>
                <div>
                    <label class="field-label" style="color:var(--tg-muted);">Фотографія роботи:</label>
                    <input type="file" id="newWorkImageFile" class="input-box" accept="image/*" style="padding: 6px; background:var(--tg-card-hover); border-color:var(--tg-border); color:var(--tg-text);">
                </div>
                <button class="btn-main" onclick="uploadWorkToMainSite()">Завантажити на сайт</button>
            </div>

        </div>

    </div>

    <!-- Ультрасучасна нижня панель навігації у вигляді капсули -->
    <div class="tg-bottom-nav" id="tgBottomNav" style="display: none;">
        <button class="tg-nav-btn active" onclick="switchMasterSection('secCalendar', this)">
            <span class="icon">📅</span>
            <span>Календар</span>
        </button>
        <button class="tg-nav-btn" onclick="switchMasterSection('secFinances', this)">
            <span class="icon">💰</span>
            <span>Фінанси</span>
        </button>
        <button class="tg-nav-btn" onclick="switchMasterSection('secClients', this)">
            <span class="icon">👥</span>
            <span>Клієнти</span>
        </button>
        <button class="tg-nav-btn" onclick="switchMasterSection('secWorks', this)">
            <span class="icon">✨</span>
            <span>Роботи</span>
        </button>
        <button class="tg-nav-btn" onclick="logoutMaster()">
            <span class="icon">🚪</span>
            <span>Вихід</span>
        </button>
    </div>

    <!-- Модальне вікно для нового запису -->
    <div id="bookingModalPopup" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.8); z-index:99999; justify-content:center; align-items:center; padding:20px;">
        <div class="master-section" style="border:1px solid var(--accent); border-radius:16px; padding:18px; width:100%; max-width:340px; max-height:85vh; overflow-y:auto; box-shadow: 0 10px 30px rgba(0,0,0,0.6);">
            <h3 style="font-family:'Syne',sans-serif; font-size:14px; color:var(--accent); margin-bottom:10px;">✨ Новий запис клієнта</h3>
            <div id="modalBookingDetails" style="font-size:11px; line-height:1.6; color:var(--tg-text); margin-bottom:14px;"></div>
            <button class="btn-main" onclick="closeBookingModal()">Зрозуміло / Закрити</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        // Перемикання світлої та темної тем
        function toggleMasterTheme() {
            let body = document.body;
            let current = body.getAttribute('data-theme');
            let next = current === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', next);
            localStorage.setItem('illiana_master_theme', next);
        }

        window.addEventListener('DOMContentLoaded', () => {
            let savedTheme = localStorage.getItem('illiana_master_theme') || 'dark';
            document.body.setAttribute('data-theme', savedTheme);
        });

        // Пошук та фільтрація записів
        async function filterCrmBookings(query) {
            let q = query.toLowerCase().trim();
            try {
                let res = await fetch('/api/bookings');
                let books = await res.json() || [];
                let container = document.getElementById('dayBookingsContainer');
                
                if (!q) {
                    if (typeof renderSelectedDayBookings === 'function') renderSelectedDayBookings();
                    return;
                }

                let filtered = books.filter(b => 
                    (b.name && b.name.toLowerCase().includes(q)) ||
                    (b.phone && b.phone.includes(q)) ||
                    (b.service && b.service.toLowerCase().includes(q)) ||
                    (b.date && b.date.includes(q))
                );

                if (container) {
                    container.innerHTML = filtered.length > 0 ? filtered.map(b => `
                        <div class="booking-item" style="background:var(--tg-card-hover);">
                            <div><b>${b.date} о ${b.time}</b> — ${b.name} (${b.phone})</div>
                            <div style="font-size:8px; color:var(--tg-muted);">${b.service}</div>
                        </div>
                    `).join('') : `<div style="font-size:9px; color:var(--tg-muted); text-align:center; padding:10px;">Нічого не знайдено</div>`;
                }
            } catch(e) {}
        }

        function switchMasterSection(sectionId, el) {
            document.querySelectorAll('.master-section').forEach(s => {
                if(s.id !== 'masterLoginBox' && s.id !== 'bookingModalPopup') s.style.display = 'none';
            });
            let target = document.getElementById(sectionId);
            if (target) target.style.display = 'flex';
            
            document.querySelectorAll('.tg-nav-btn').forEach(i => i.classList.remove('active'));
            if (el) el.classList.add('active');
        }

        function showMasterDashboard() {
            let loginBox = document.getElementById('masterLoginBox');
            let dash = document.getElementById('masterDashboard');
            let nav = document.getElementById('tgBottomNav');
            if (loginBox) loginBox.style.display = 'none';
            if (dash) dash.style.display = 'flex';
            if (nav) nav.style.display = 'flex';
            switchMasterSection('secCalendar', document.querySelector('.tg-nav-btn'));
            updateCrmCounters();
        }

        async function updateCrmCounters() {
            try {
                let resB = await fetch('/api/bookings');
                let books = await resB.json() || [];
                let bBadge = document.getElementById('totalBookingsCountBadge');
                if (bBadge) bBadge.innerText = books.length;

                let clients = JSON.parse(localStorage.getItem('illiana_regular_clients') || '[]');
                let cBadge = document.getElementById('totalClientsCountBadge');
                if (cBadge) cBadge.innerText = clients.length;
            } catch(e) {}
        }

        function loginMainPin() {
            let p = document.getElementById('masterPinInput')?.value.trim();
            if (p === '1988' || p === '') {
                localStorage.setItem('illiana_master_logged', 'true');
                showMasterDashboard();
            } else { alert("Невірний PIN-код!"); }
        }

        function forceBypassPin() {
            localStorage.setItem('illiana_master_logged', 'true');
            showMasterDashboard();
        }

        function logoutMaster() {
            localStorage.removeItem('illiana_master_logged');
            location.reload();
        }

        function playNotificationSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                oscillator.frequency.setValueAtTime(880, audioCtx.currentTime + 0.15);
                
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.5);
            } catch(e) {}
        }

        let lastKnownBookingsCount = -1;
        let latestBookingDate = null;

        async function handleBannerClick() {
            playNotificationSound();
            try {
                let res = await fetch('/api/bookings');
                let books = await res.json() || [];
                if (books.length > 0) {
                    let newest = books[books.length - 1];
                    latestBookingDate = newest.date;
                    
                    let detailsEl = document.getElementById('modalBookingDetails');
                    if (detailsEl) {
                        let hairImg = newest.hairPhoto ? `<div style="margin-top:6px;"><a href="${newest.hairPhoto}" target="_blank" style="color:var(--accent); font-weight:700;">📸 Переглянути фото волосся</a></div>` : '';
                        let refImg = newest.refPhoto ? `<div style="margin-top:4px;"><a href="${newest.refPhoto}" target="_blank" style="color:var(--accent); font-weight:700;">🎨 Переглянути референс</a></div>` : '';
                        
                        detailsEl.innerHTML = `
                            <div><b>Ім'я:</b> ${newest.name}</div>
                            <div><b>Телефон:</b> <a href="tel:${newest.phone}" style="color:var(--accent);">${newest.phone}</a></div>
                            <div><b>Дата та час:</b> ${newest.date} о ${newest.time}</div>
                            <div><b>Послуга:</b> ${newest.service}</div>
                            <div><b>Email:</b> ${newest.email || '—'}</div>
                            <div><b>Соцмережі:</b> ${newest.social || '—'}</div>
                            ${hairImg}
                            ${refImg}
                        `;
                    }
                    let modal = document.getElementById('bookingModalPopup');
                    if (modal) modal.style.display = 'flex';
                }
            } catch(e) {}

            switchMasterSection('secCalendar', document.querySelector('.tg-nav-btn'));
            if (latestBookingDate && typeof selectCalendarDate === 'function') {
                selectCalendarDate(latestBookingDate);
            }
        }

        function closeBookingModal() {
            let modal = document.getElementById('bookingModalPopup');
            if (modal) modal.style.display = 'none';
        }

        window.addEventListener('DOMContentLoaded', () => {
            document.body.addEventListener('click', () => {
                try {
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                } catch(e) {}
            }, { once: true });

            if (localStorage.getItem('illiana_master_logged') === 'true') {
                showMasterDashboard();
            }

            setInterval(async () => {
                try {
                    let res = await fetch('/api/bookings');
                    let books = await res.json() || [];
                    
                    if (lastKnownBookingsCount !== -1 && books.length > lastKnownBookingsCount) {
                        playNotificationSound();
                    }
                    lastKnownBookingsCount = books.length;

                    if (books.length > 0) {
                        let banner = document.getElementById('newBookingAlertBanner');
                        let bannerText = document.getElementById('alertBannerText');
                        if (banner) banner.style.display = 'flex';
                        if (bannerText) bannerText.innerText = `🔔 Новий запис! Бронювань: ${books.length}`;
                        updateCrmCounters();
                    }
                } catch(e) {}
            }, 5000);
        });
    </script>
</body>
</html>
