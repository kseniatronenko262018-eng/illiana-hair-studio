<!DOCTYPE html>
<html lang="ua" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Кабінет майстра | Явір Ілляна</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .master-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -999; overflow: hidden; background-color: #111;
        }
        .master-bg img {
            width: 100%; height: 100%; object-fit: cover;
            filter: blur(3px) brightness(0.6) contrast(1.1);
        }
        .app-drawer {
            position: fixed; top: 0; left: -280px; width: 260px; height: 100vh;
            background: var(--card-bg); backdrop-filter: blur(16px);
            border-right: 1px solid var(--border); z-index: 9999;
            transition: left 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex; flex-direction: column; padding: 20px 14px; gap: 12px;
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
        }
        .app-drawer.open { left: 0; }
        .drawer-item {
            padding: 12px 14px; border-radius: 10px; background: rgba(255,255,255,0.03);
            border: 1px solid var(--border); font-size: 11px; font-weight: 700;
            color: var(--text-main); cursor: pointer; text-transform: uppercase;
            display: flex; align-items: center; gap: 10px;
        }
        .drawer-item:hover, .drawer-item.active {
            background: var(--accent); color: var(--accent-invert); border-color: var(--accent);
        }
        .notification-banner {
            background: rgba(184, 50, 50, 0.3); border: 1px solid var(--accent);
            padding: 10px; border-radius: 10px; font-size: 10px; color: var(--text-main);
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <div class="master-bg">
        <img src="PXL_20260322_183655575.MP.jpg" alt="Master Background" onerror="this.src='https://i.ibb.co/M5stSykh/photo-2026-09-30-14-50-24.jpg'">
    </div>

    <!-- Виїзне меню -->
    <div id="masterMenuDrawer" class="app-drawer">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h3 style="font-family:'Syne',sans-serif; font-size:14px; color:var(--text-main);">МЕНЮ МАЙСТРА</h3>
            <button class="control-btn" onclick="toggleMasterMenu()">✕</button>
        </div>
        <div class="drawer-item active" onclick="switchMasterSection('secCalendar', this)">📅 Календар та записи</div>
        <div class="drawer-item" onclick="switchMasterSection('secFinances', this)">💰 Доходи та витрати</div>
        <div class="drawer-item" onclick="switchMasterSection('secClients', this)">👥 База клієнтів</div>
        <div class="drawer-item" onclick="switchMasterSection('secWorks', this)">✨ Завантажити приклади робіт</div>
        <div class="drawer-item" onclick="logoutMaster()" style="margin-top: auto; border-color: var(--accent); color: var(--accent);">🚪 Вийти з CRM</div>
    </div>

    <div class="mobile-container master-body">
        
        <div class="utility-bar">
            <button class="control-btn" onclick="toggleMasterMenu()">☰ Меню</button>
            <span>CRM // ЯВІР ІЛЛЯНА</span>
            <button class="control-btn" onclick="toggleTheme()">☀️/🌙</button>
        </div>

        <!-- Екран авторизації -->
        <div id="masterLoginBox" class="form-card" style="text-align: center; margin-top: 40px;">
            <h2 style="font-family:'Syne',sans-serif; font-size: 18px; margin-bottom: 10px;">КАБІНЕТ МАЙСТРА</h2>
            <input type="password" id="masterPinInput" class="input-box" placeholder="PIN (1988)" style="text-align: center; margin-bottom: 10px;">
            <button class="btn-main" onclick="loginMainPin()">Увійти</button>
            <button class="control-btn" onclick="forceBypassPin()" style="margin-top: 8px; width: 100%;">Швидкий вхід</button>
        </div>

        <!-- Панель управління CRM -->
        <div id="masterDashboard" style="display: none; flex-direction: column; gap: 12px;">

            <div id="newBookingAlertBanner" class="notification-banner" style="display: none;">
                <span id="alertBannerText">🔔 Є нові записи або активні броні!</span>
                <button class="control-btn" onclick="switchMasterSection('secCalendar', document.querySelector('.drawer-item'))">Переглянути</button>
            </div>

            <!-- 1. КАЛЕНДАР -->
            <div id="secCalendar" class="master-section form-card">
                <div class="calendar-controls">
                    <button class="control-btn" onclick="changePeriod(-1)">◀</button>
                    <h3 id="calendarTitle" style="font-size: 12px; font-family:'Syne',sans-serif;">Місяць</h3>
                    <button class="control-btn" onclick="changePeriod(1)">▶</button>
                </div>
                <div style="display: flex; gap: 4px; margin-bottom: 6px;">
                    <button class="control-btn" id="btnModeMonth" onclick="setCalendarMode('month')" style="flex:1;">Місяць</button>
                    <button class="control-btn" id="btnModeWeek" onclick="setCalendarMode('week')" style="flex:1;">Тиждень</button>
                </div>
                <div id="calendarGridContainer"></div>
                <button class="control-btn" id="blockDayBtn" onclick="toggleBlockSelectedDate()" style="margin-top: 8px; width: 100%;">🔒 Заблокувати день (вихідний)</button>
                <div style="margin-top: 10px;">
                    <label class="field-label" id="selectedDateLabel">Записи на обраний день:</label>
                    <div id="dayBookingsContainer" style="display: flex; flex-direction: column; gap: 6px; max-height: 200px; overflow-y: auto;"></div>
                </div>
            </div>

            <!-- 2. ФІНАНСИ ТА PDF ЗВІТИ -->
            <div id="secFinances" class="master-section form-card" style="display: none;">
                <h3 style="font-size: 13px; font-family:'Syne',sans-serif; text-transform:uppercase;">Фінанси та аналітика</h3>
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; text-align: center;">
                    <div style="background:var(--card-hover); padding:8px; border-radius:8px; border:1px solid var(--border);">
                        <div style="font-size:8px; color:var(--text-muted);">ДОХОДИ</div>
                        <div id="statCompleted" style="font-size:11px; font-weight:700;">0 ₴</div>
                    </div>
                    <div style="background:var(--card-hover); padding:8px; border-radius:8px; border:1px solid var(--border);">
                        <div style="font-size:8px; color:var(--text-muted);">ВИТРАТИ</div>
                        <div id="statExpenses" style="font-size:11px; font-weight:700; color:var(--accent);">0 ₴</div>
                    </div>
                    <div style="background:var(--card-hover); padding:8px; border-radius:8px; border:1px solid var(--border);">
                        <div style="font-size:8px; color:var(--text-muted);">ПРИБУТОК</div>
                        <div id="statNetProfit" style="font-size:11px; font-weight:700; color:#4ade80;">0 ₴</div>
                    </div>
                </div>

                <div style="margin-top: 8px;">
                    <label class="field-label">Додати витрату:</label>
                    <div style="display: flex; gap: 6px;">
                        <input type="text" id="expenseNameInput" class="input-box" placeholder="Назва">
                        <input type="number" id="expenseAmountInput" class="input-box" placeholder="Сума ₴" style="max-width: 90px;">
                        <button class="control-btn" onclick="addExpense()">+</button>
                    </div>
                    <div id="expensesListContainer" style="display: flex; flex-direction: column; gap: 4px; margin-top: 6px; max-height: 120px; overflow-y: auto;"></div>
                </div>

                <button class="control-btn" onclick="exportToExcel()" style="margin-top: 6px; width: 100%;">📥 Експортувати записи в Excel</button>
                <button class="control-btn" onclick="exportFinancesToPDF()" style="margin-top: 6px; width: 100%; border-color: #4ade80; color: #4ade80;">📄 Завантажити звіт у PDF</button>
            </div>

            <!-- 3. БАЗА КЛІЄНТІВ (Імпорт/Експорт Excel + нікнейми) -->
            <div id="secClients" class="master-section form-card" style="display: none;">
                <h3 style="font-size: 13px; font-family:'Syne',sans-serif; text-transform:uppercase;">База клієнтів</h3>
                <div style="display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px;">
                    <input type="text" id="regClientName" class="input-box" placeholder="Ім'я клієнта">
                    <input type="tel" id="regClientPhone" class="input-box" placeholder="Телефон">
                    <input type="text" id="regClientSocial" class="input-box" placeholder="Нікнейм (Inst / Telegram)">
                    <button class="control-btn" onclick="addRegularClientManual()">Додати клієнта</button>
                </div>
                
                <div style="display: flex; gap: 6px; margin-top: 8px;">
                    <button class="control-btn" onclick="exportClientsToExcel()" style="flex:1;">📤 Експорт бази (Excel)</button>
                    <label class="control-btn" style="flex:1; text-align:center; cursor:pointer;">
                        📥 Імпорт бази
                        <input type="file" accept=".xlsx, .xls" onchange="importClientsFromExcel(event)" style="display: none;">
                    </label>
                </div>
                <div id="regularClientsContainer" style="display: flex; flex-direction: column; gap: 4px; max-height: 150px; overflow-y: auto; margin-top: 8px;"></div>
            </div>

            <!-- 4. ЗАВАНТАЖИТИ РОБОТИ НА САЙТ -->
            <div id="secWorks" class="master-section form-card" style="display: none;">
                <h3 style="font-size: 13px; font-family:'Syne',sans-serif; text-transform:uppercase;">Завантажити приклади робіт</h3>
                <div>
                    <label class="field-label">Назва / опис роботи:</label>
                    <input type="text" id="newWorkTitleInput" class="input-box" placeholder="Стрижка / Тонування">
                </div>
                <div>
                    <label class="field-label">Фотографія роботи:</label>
                    <input type="file" id="newWorkImageFile" class="input-box" accept="image/*" style="padding: 6px;">
                </div>
                <button class="btn-main" onclick="uploadWorkToMainSite()">Завантажити на сайт</button>
            </div>

        </div>

    </div>

    <script src="app.js"></script>
    <script>
        function switchMasterSection(sectionId, el) {
            document.querySelectorAll('.master-section').forEach(s => s.style.display = 'none');
            let target = document.getElementById(sectionId);
            if (target) target.style.display = 'flex';
            document.querySelectorAll('.drawer-item').forEach(i => i.classList.remove('active'));
            if (el) el.classList.add('active');
            toggleMasterMenu();
        }

        function loginMainPin() {
            let p = document.getElementById('masterPinInput')?.value.trim();
            if (p === '1988' || p === '') {
                localStorage.setItem('illiana_master_logged', 'true');
                showMasterDashboard();
            } else { alert("Невірний PIN-код!"); }
        }

        // Звуковий сигнал сповіщення про новий запис
        function playNotificationSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                oscillator.frequency.setValueAtTime(880, audioCtx.currentTime + 0.15);
                
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.5);
            } catch(e) {}
        }

        let lastKnownBookingsCount = -1;

        window.addEventListener('DOMContentLoaded', () => {
            setInterval(async () => {
                try {
                    let res = await fetch('/api/bookings');
                    let books = await res.json() || [];
                    
                    if (lastKnownBookingsCount !== -1 && books.length > lastKnownBookingsCount) {
                        playNotificationSound();
                    }
                    lastKnownBookingsCount = books.length;

                    if (books.length > 0) {
                        let banner = document.getElementById('newBookingAlertBanner');
                        let bannerText = document.getElementById('alertBannerText');
                        if (banner) banner.style.display = 'flex';
                        if (bannerText) bannerText.innerText = `🔔 Новий запис! Активних бронювань: ${books.length}`;
                    }
                } catch(e) {}
            }, 8000);
        });
    </script>
</body>
</html>
